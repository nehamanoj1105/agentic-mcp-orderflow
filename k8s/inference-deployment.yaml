apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-inference-deployment
  labels:
    app: market-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: market-inference
  template:
    metadata:
      labels:
        app: market-inference
    spec:
      containers:
      - name: inference-api
        image: market-microstructure-system:latest
        command: ["python", "api/main.py"]
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: market-inference-service
spec:
  type: ClusterIP
  selector:
    app: market-inference
  ports:
  - port: 8000
    targetPort: 8000
