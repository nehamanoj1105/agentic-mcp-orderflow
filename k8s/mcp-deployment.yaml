apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-mcp-deployment
  labels:
    app: market-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-mcp
  template:
    metadata:
      labels:
        app: market-mcp
    spec:
      containers:
      - name: mcp-server
        image: market-microstructure-system:latest
        command: ["python", "mcp_server/server.py"]
        ports:
        - containerPort: 8001
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: market-mcp-service
spec:
  type: ClusterIP
  selector:
    app: market-mcp
  ports:
  - port: 8001
    targetPort: 8001
