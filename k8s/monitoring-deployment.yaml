apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-monitoring-deployment
  labels:
    app: market-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-monitoring
  template:
    metadata:
      labels:
        app: market-monitoring
    spec:
      containers:
      - name: dashboard-service
        image: market-microstructure-system:latest
        command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
        ports:
        - containerPort: 8501
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: market-monitoring-service
spec:
  type: LoadBalancer
  selector:
    app: market-monitoring
  ports:
  - port: 8501
    targetPort: 8501
