version: '3.8'

services:
  inference-api:
    build: .
    container_name: market_inference_api
    command: python api/main.py
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always

  mcp-server:
    build: .
    container_name: market_mcp_server
    command: python mcp_server/server.py
    ports:
      - "8001:8001"
    restart: always

  dashboard:
    build: .
    container_name: market_dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - inference-api
    restart: always
